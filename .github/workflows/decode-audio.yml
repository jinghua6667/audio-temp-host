name: Decode Audio
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/decode-audio.yml'
      - 'parts/**'
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 audio
        run: |
          cat parts/b64part_aa parts/b64part_ab parts/b64part_ac > full.b64
          base64 -d full.b64 > ref_voice.mp3
      - name: Commit decoded audio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ref_voice.mp3
          git commit -m "add decoded reference mp3" || echo "no changes"
          git push
